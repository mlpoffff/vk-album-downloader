appId: com.mlpoffff.vkalbum
productName: VKAlbum
executableName: VKAlbum

files:
  - electron/**
  - "!electron/build_assets/**"
  - .output/**
  - "!**/*.map"
  - .env

asar: true
asarUnpack:
  - .output/**

compression: maximum

electronLanguages:
  - ru
  - en-US

win:
  icon: electron/build_assets/logo.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: electron/build_assets/logo.icns
  category: public.app-category.productivity

linux:
  category: Utility
  maintainer: author <author@example.com>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: VKAlbum
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerSidebar: electron/build_assets/sidebar.bmp
  uninstallerSidebar: electron/build_assets/sidebar.bmp

dmg:
  background: electron/build_assets/installer.tiff
  icon: electron/build_assets/volume.icns
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

directories:
  output: .builds
